name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps --no-shell chromium
      - run: npm run check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dashboard-${{ matrix.os }}
          path: |
            artifacts/dashboard-browser-results.json
            artifacts/dashboard-*.png
            test-results/
